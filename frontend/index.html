<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Quotes Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Quotes Dashboard</h1>

  <div class="controls">
    <input id="search" placeholder="Search author or quote...">
    <button id="btn">Search</button>
  </div>

  <table>
    <thead>
      <tr><th>Quote</th><th>Author</th><th>Tags</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
